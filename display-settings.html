
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RK Store - Display Settings</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* HEADER */

.header {
    background: #ff6600;
    color: white;
    padding: 10px;
    text-align: center;
    position: relative;
}

.header h2 {
    margin: 0;
    font-size: 23px;
}

.header p {
    margin: 3px 0 0;
}

.back-button {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    text-decoration: none;
    font-size: 28px;
    font-weight: bold;
}

/* CONTENT */

.container {
    width: 92%;
    max-width: 600px;
    margin: 25px auto;
}

.settings-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.settings-title {
    font-size: 22px;
    font-weight: bold;
    color: #ff6600;
    margin-bottom: 20px;
}

.mode-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 15px 0;
}

.mode-name {
    font-size: 17px;
    font-weight: bold;
}

.mode-description {
    margin-top: 6px;
    font-size: 13px;
    color: #777;
}

/* DARK MODE SWITCH */

.switch {
    position: relative;
    width: 52px;
    height: 28px;
    flex-shrink: 0;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
}

.slider:before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    left: 4px;
    top: 4px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
}

.switch input:checked + .slider {
    background: #ff6600;
}

.switch input:checked + .slider:before {
    transform: translateX(24px);
}

.info {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid #eee;
    font-size: 13px;
    color: #777;
    line-height: 1.5;
}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

    <a
        href="settings.html"
        class="back-button"
        aria-label="Back"
    >
        ←
    </a>

    <h2>RK Store</h2>

    <p>Display Settings</p>

</header>


<!-- DISPLAY SETTINGS -->

<main class="container">

    <div class="settings-box">

        <div class="settings-title">
            🌓 Display Settings
        </div>

        <div class="mode-row">

            <div>

                <div class="mode-name">
                    🌙 Dark Mode
                </div>

                <div class="mode-description">
                    Turn dark appearance ON or OFF
                </div>

            </div>

            <label class="switch">

                <input
                    type="checkbox"
                    id="darkMode"
                >

                <span class="slider"></span>

            </label>

        </div>

        <div class="info">
            Your Dark Mode preference will be saved
            automatically on this device.
        </div>

    </div>

</main>


<!-- SAVE DISPLAY SETTING -->

<script>

const darkMode =
    document.getElementById("darkMode");


// Load saved preference

darkMode.checked =
    localStorage.getItem("rkDarkMode") === "true";


// Save preference when changed

darkMode.addEventListener("change", function() {

    localStorage.setItem(
        "rkDarkMode",
        darkMode.checked ? "true" : "false"
    );

});

</script>

</body>

</html>
