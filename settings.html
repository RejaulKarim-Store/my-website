<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RK Store - Settings</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

        }


        .header {
    background: #ff6600;
    color: white;
    padding: 6px;
    text-align: center;
    position: relative;
}


        .header h1 {

            margin: 0;

        }

.header p {

    margin: 2px 0 0;

}

.header-back-button {

    position: absolute;

    left: 10px;

    top: 50%;

    transform: translateY(-50%);

    color: white;

    text-decoration: none;

    font-size: 28px;

    font-weight: bold;

}
        .container {

            width: 92%;

            max-width: 600px;

            margin: 25px auto;

        }


        .settings-box {

            background: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.12);

        }


        .settings-title {

            font-size: 22px;

            font-weight: bold;

            color: #ff6600;

            margin-bottom: 20px;

        }


    .setting-button {

    display: block;

    width: 100%;

    padding: 13px 10px;

    margin: 9px 0;

    border: 1px solid #d5d5d5;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f1f1f1
        );

    color: #222;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    text-align: left;

    box-shadow:
        0 3px 0 #b5b5b5;

}


.setting-button:active {

    transform:
        translateY(3px);

    box-shadow:
        0 1px 0 #b5b5b5;

}


.logout-button {

    display: block;

    width: 100%;

    padding: 13px 10px;

    margin: 9px 0;

    border: 1px solid #d5d5d5;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f1f1f1
        );

    color: #222;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    text-align: left;

    box-shadow:
        0 3px 0 #b5b5b5;

}


.logout-button:active {

    transform:
        translateY(3px);

    box-shadow:
        0 1px 0 #b5b5b5;

}


/* =========================================
   RK STORE MESSAGE POPUP
========================================= */

.rk-message-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
}

.rk-message-box {
    width: min(300px, 85%);
    background: white;
    border-radius: 8px;
    padding: 18px 16px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
}

.rk-message-text {
    font-size: 16px;
    color: #333;
    margin-bottom: 16px;
    white-space: pre-line;
}

.rk-message-button {
    background: #ff6600;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 8px 24px;
    font-size: 14px;
    cursor: pointer;
}

    </style>

</head>


<body>


    <div class="header">

    <a
        href="account.html"
        class="header-back-button"
        aria-label="Back"
    >
        ←
    </a>

    <h1>RK Store</h1>

    <p>Settings</p>

</div>


    <div class="container">


        <div class="settings-box">


            <div class="settings-title">

                ⚙️ Settings

            </div>


           <button
    type="button"
    class="setting-button"
    onclick="window.location.href='customer-account-settings.html'"
>
    👤 Account Settings
</button>

       
<button
    type="button"
    class="setting-button"
    onclick="window.location.href='display-settings.html'"
>
    🌓 Display Settings
</button>

   
<button
    type="button"
    class="logout-button"
    onclick="logoutCustomer()"
>
    🚪 Logout
</button>



        </div>

    </div>


<!-- RK STORE CUSTOM MESSAGE POPUP -->

<div
    id="rkMessageOverlay"
    class="rk-message-overlay"
    style="display: none;"
    onclick="if (event.target === this) closeRKMessage();"
>
    <div class="rk-message-box">

        <div
            id="rkMessageText"
            class="rk-message-text"
        ></div>

        <button
            type="button"
            class="rk-message-button"
            onclick="
                const overlay = document.getElementById('rkMessageOverlay');
                const goHome = overlay.dataset.goHome;

                closeRKMessage();

                if (goHome === 'true') {
                    window.location.href = 'index.html';
                }
            "
        >
            OK
        </button>

    </div>
</div>

    <script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

        authDomain:
            "rk-store-5fb24.firebaseapp.com",

        projectId:
            "rk-store-5fb24",

        storageBucket:
            "rk-store-5fb24.firebasestorage.app",

        messagingSenderId:
            "407275549697",

        appId:
            "1:407275549697:web:41043b49bf7182cecffc00"

    };


    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(app);


    

    /* =========================
       LOGOUT
    ========================= */

    window.logoutCustomer =
    async function() {

        try {

            await signOut(auth);

            showRKMessage(
    "You have been logged out.\nআপনি সফলভাবে আপনার অ্যাকাউন্ট থেকে লগআউট করেছেন।",
    true
);

        }

        catch (error) {

            console.error(
                "Logout Error:",
                error
            );

            showRKMessage(
    "Logout failed. Please try again.\nলগআউট করা যায়নি। অনুগ্রহ করে আবার চেষ্টা করুন।"
);

        }

    };

</script>


<script>

/* =========================================
   RK STORE CUSTOM MESSAGE FUNCTION
========================================= */

function showRKMessage(message, goHome = false) {

    const overlay =
        document.getElementById("rkMessageOverlay");

    document.getElementById(
        "rkMessageText"
    ).textContent = message;

    overlay.dataset.goHome =
        goHome ? "true" : "false";

    overlay.style.display = "flex";

}


function closeRKMessage() {

    document.getElementById(
        "rkMessageOverlay"
    ).style.display = "none";

}

</script>


</body>

</html>
