<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RK Store - Settings</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

        }


        .header {
    background: #ff6600;
    color: white;
    padding: 6px;
    text-align: center;
    position: relative;
}


        .header h1 {

            margin: 0;

        }

.header p {

    margin: 2px 0 0;

}

.header-back-button {

    position: absolute;

    left: 10px;

    top: 50%;

    transform: translateY(-50%);

    color: white;

    text-decoration: none;

    font-size: 28px;

    font-weight: bold;

}
        .container {

            width: 92%;

            max-width: 600px;

            margin: 25px auto;

        }


        .settings-box {

            background: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.12);

        }


        .settings-title {

            font-size: 22px;

            font-weight: bold;

            color: #ff6600;

            margin-bottom: 20px;

        }


    .setting-button {

    display: block;

    width: 100%;

    padding: 13px 15px;

    margin-bottom: 12px;

    border: 1px solid #e2cfc0;

    border-radius: 9px;

    background: linear-gradient(
        145deg,
        #fffaf6,
        #f1e5dc
    );

    color: #333333;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    text-align: left;

    box-shadow:
        3px 3px 6px rgba(0,0,0,0.12),
        -2px -2px 5px rgba(255,255,255,0.9);

    transition: all 0.15s ease;

}


.setting-button:hover {

    transform: translateY(-1px);

}


.setting-button:active {

    transform: translateY(2px);

    box-shadow:
        inset 2px 2px 5px rgba(0,0,0,0.15),
        inset -2px -2px 4px rgba(255,255,255,0.8);

}


.logout-button {

    display: block;

    width: 100%;

    padding: 13px 15px;

    margin-top: 25px;

    border: 1px solid #d5d5d5;

    border-radius: 9px;

    background: linear-gradient(
        145deg,
        #ffffff,
        #e8e8e8
    );

    color: #333333;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    text-align: left;

    box-shadow:
        3px 3px 6px rgba(0,0,0,0.12),
        -2px -2px 5px rgba(255,255,255,0.9);

    transition: all 0.15s ease;

}


.logout-button:hover {

    transform: translateY(-1px);

}


.logout-button:active {

    transform: translateY(2px);

    box-shadow:
        inset 2px 2px 5px rgba(0,0,0,0.15),
        inset -2px -2px 4px rgba(255,255,255,0.8);

}
    </style>

</head>


<body>


    <div class="header">

    <a
        href="account.html"
        class="header-back-button"
        aria-label="Back"
    >
        ←
    </a>

    <h1>RK Store</h1>

    <p>Settings</p>

</div>


    <div class="container">


        <div class="settings-box">


            <div class="settings-title">

                ⚙️ Settings

            </div>


            <button
                class="setting-button"
                onclick="alert('Account Settings coming soon.')"
            >

                👤 Account Settings

            </button>


          
<button
    type="button"
    class="logout-button"
    onclick="logoutCustomer()"
>
    🚪 Logout
</button>



        </div>

    </div>


    <script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

        authDomain:
            "rk-store-5fb24.firebaseapp.com",

        projectId:
            "rk-store-5fb24",

        storageBucket:
            "rk-store-5fb24.firebasestorage.app",

        messagingSenderId:
            "407275549697",

        appId:
            "1:407275549697:web:41043b49bf7182cecffc00"

    };


    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(app);


    

    /* =========================
       LOGOUT
    ========================= */

    window.logoutCustomer =
    async function() {

        try {

            await signOut(auth);

            alert(
                "You have been logged out."
            );

            window.location.href =
                "index.html";

        }

        catch (error) {

            console.error(
                "Logout Error:",
                error
            );

            alert(
                "Logout failed. Please try again."
            );

        }

    };

</script>


</body>

</html>
