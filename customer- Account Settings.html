<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RK Store - Customer Settings</title>

    <meta name="theme-color" content="#ff6600">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .header {
            background: #ff6600;
            color: white;
            padding: 8px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            margin: 0;
            font-size: 23px;
        }

        .header p {
            margin: 3px 0 0;
        }

        .header-back-button {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            text-decoration: none;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 600px;
            margin: 22px auto;
        }

        .settings-box {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .settings-title {
            font-size: 21px;
            font-weight: bold;
            color: #ff6600;
            margin-bottom: 18px;
        }

        .info-box {
            background: #fff7f0;
            border: 1px solid #ffd3b5;
            border-radius: 8px;
            padding: 13px;
            margin-bottom: 18px;
            overflow-wrap: anywhere;
        }

        .info-label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .info-value {
            line-height: 1.5;
        }

        .section-title {
            font-size: 17px;
            font-weight: bold;
            margin: 20px 0 10px;
        }

        .setting-button {
            display: block;
            width: 100%;
            padding: 13px 10px;
            margin: 10px 0;
            border: 1px solid #d5d5d5;
            border-radius: 9px;
            background: linear-gradient(145deg, #ffffff, #f1f1f1);
            color: #222;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            box-shadow: 0 3px 0 #b5b5b5;
        }

        .setting-button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b5b5b5;
        }

        .notice {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 12px;
        }

        .logout-button {
            color: #b3261e;
        }

        #statusMessage {
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <div class="header">
        <a
            href="account.html"
            class="header-back-button"
            aria-label="Back"
        >←</a>

        <h1>RK Store</h1>
        <p>Customer Settings</p>
    </div>

    <div class="container">
        <div class="settings-box">

            <div class="settings-title">
                ⚙️ Account Settings
            </div>

            <div class="info-box">
                <div class="info-label">📧 Login Email</div>
                <div class="info-value" id="customerEmail">
                    Loading account information...
                </div>
            </div>

            <div class="section-title">🔐 Password</div>

            <button
                type="button"
                class="setting-button"
                id="changePasswordButton"
            >
                🔑 Change Password
            </button>

            <div class="notice">
                For security, your current password cannot be displayed.
                To change your password, you may need to sign in again
                before a password-reset email can be sent.
            </div>

            <div id="statusMessage" role="status"></div>

            <button
                type="button"
                class="setting-button logout-button"
                id="logoutButton"
            >
                🚪 Logout
            </button>

        </div>
    </div>

    <script type="module">

        import {
            initializeApp,
            getApps
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkBQaphKKzW_xd1GgKAVoxqR4taKvzdEM",
            authDomain: "rk-store-5fb24.firebaseapp.com",
            projectId: "rk-store-5fb24",
            storageBucket: "rk-store-5fb24.firebasestorage.app",
            messagingSenderId: "407275549697",
            appId: "1:407275549697:web:41043b49bf7182cecffc00"
        };

        const app = getApps().length
            ? getApps()[0]
            : initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const customerEmail =
            document.getElementById("customerEmail");

        const statusMessage =
            document.getElementById("statusMessage");

        const changePasswordButton =
            document.getElementById("changePasswordButton");

        let currentUser = null;

        onAuthStateChanged(auth, function(user) {

            currentUser = user;

            if (!user) {
                customerEmail.textContent =
                    "You are not logged in.";

                statusMessage.textContent =
                    "Please log in to view your account settings.";

                changePasswordButton.disabled = true;
                return;
            }

            customerEmail.textContent =
                user.email || "No email is linked to this account.";

            changePasswordButton.disabled = !user.email;

        });

        changePasswordButton.addEventListener("click", async function() {

            if (!currentUser || !currentUser.email) {
                statusMessage.textContent =
                    "A login email is not available for this account.";
                return;
            }

            try {

                await sendPasswordResetEmail(
                    auth,
                    currentUser.email
                );

                statusMessage.textContent =
                    "If this email is registered for password login, a password-reset email has been sent. Please check your inbox and spam folder.";

            } catch (error) {

                console.error("Password Reset Error:", error);

                if (error.code === "auth/requires-recent-login") {
                    statusMessage.textContent =
                        "For security, please log in again and then try changing your password.";
                } else {
                    statusMessage.textContent =
                        "Could not send the reset email. Please check your login and try again.";
                }

            }

        });

        document.getElementById("logoutButton")
            .addEventListener("click", async function() {

                try {

                    await signOut(auth);

                    window.location.href = "index.html";

                } catch (error) {

                    console.error("Logout Error:", error);

                    statusMessage.textContent =
                        "Logout failed. Please try again.";

                }

            });

    </script>

</body>
</html>
