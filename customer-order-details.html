        /* =========================
           ORDER STATUS TIMELINE
        ========================= */

        .timeline {
            margin-top: 10px;
            position: relative;
            padding-left: 5px;
        }


        .timeline-item {
            position: relative;
            padding: 0 0 30px 45px;
            color: #999;
            font-size: 16px;
            font-weight: normal;
        }


        .timeline-item:last-child {
            padding-bottom: 0;
        }


        /* Circle */

        .timeline-item::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 1px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #ddd;
            border: 3px solid #f5f5f5;
            box-shadow: 0 0 0 2px #ddd;
            z-index: 2;
        }


        /* Connecting Line */

        .timeline-item::after {
            content: "";
            position: absolute;
            left: 13px;
            top: 21px;
            width: 3px;
            height: 38px;
            background-color: #ddd;
        }


        .timeline-item:last-child::after {
            display: none;
        }


        /* Completed */

        .timeline-item.completed {
            color: #27ae60;
            font-weight: bold;
        }


        .timeline-item.completed::before {
            background-color: #27ae60;
            box-shadow: 0 0 0 2px #27ae60;
        }


        /* Active */

        .timeline-item.active {
            color: #ff6600;
            font-weight: bold;
        }


        .timeline-item.active::before {
            background-color: #ff6600;
            box-shadow: 0 0 0 3px rgba(255,102,0,0.2);

        }


        /* Active line */

        .timeline-item.active::after {

/* =========================

function formatPrice(price) {

    const number = Number(price);

    if (!Number.isFinite(number)) {
        return "0";
    }

    return Math.round(number).toLocaleString("en-US");
}


/* =========================
   MASK CUSTOMER NAME
========================= */

function maskCustomerName(name) {

    if (!name) {
        return "Customer";
    }

    const parts =
        String(name)
            .trim()
            .split(/\s+/)
            .filter(Boolean);

    if (parts.length === 0) {
        return "Customer";
    }

    const firstName =
        parts[0];

    const maskedFirstName =
        firstName.length <= 2
            ? firstName
            : firstName.slice(0, 2) +
              "*".repeat(firstName.length - 2);

    if (parts.length === 1) {
        return maskedFirstName;
    }

    const lastName =
        parts[parts.length - 1];

    const maskedLastName =
        lastName.length <= 1
            ? lastName
            : lastName.charAt(0) +
              "*".repeat(lastName.length - 1);

    return (
        maskedFirstName +
        " " +
        maskedLastName
    );
}

                            </div>

window.submitProductReview =
    async function(button) {

        const reviewForm =
            button.closest(".review-form");

        if (!reviewForm) {

        }

        const rating =
            Number(
                reviewForm.dataset.rating || 0
            );

        const textarea =
            reviewForm.querySelector(

            );

            textarea
                ? textarea.value.trim()
                : "";

        if (rating < 1) {

            alert("Please select a rating.");

            return;
        }

        if (!reviewText) {

            alert("Please write your review.");

            return;
        }

        const user =
            auth.currentUser;

        if (!user) {

            alert("Please login first.");

            return;
        }

        try {

            /* =========================
               UPDATE EXISTING REVIEW
            ========================= */

            const reviewId =
                reviewForm.dataset.reviewId;

            if (reviewId) {

                await updateDoc(
                    doc(
                        db,
                        "reviews",
                        reviewId
                    ),
                    {
                        rating:
                            rating,

                        reviewText:
                            reviewText,

                        updatedAt:
                            serverTimestamp()
                    }
                );

                alert(
                    "Your review has been updated successfully."
                );

            }

            /* =========================
               CREATE NEW REVIEW
            ========================= */

            else {

                await addDoc(
                    collection(
                        db,
                        "reviews"
                    ),
                    {
                        productId:
                            reviewForm.dataset.productId,

                        orderId:
                            orderId,

                        userId:
                            user.uid,

customerName:
    orderCustomerName,
                        rating:
                            rating,

                        reviewText:
                            reviewText,

                        createdAt:
                            serverTimestamp()
                    }
                );

                alert(
                    "Your review has been submitted successfully."
                );

            }


            /* =========================
               RESET REVIEW FORM
            ========================= */

            reviewForm.style.display =
                "none";

            if (textarea) {

                textarea.value = "";

            }

            reviewForm.dataset.rating = "";

            delete reviewForm.dataset.reviewId;


            const stars =
                reviewForm.querySelectorAll(
                    ".rating-stars span"
                );

            stars.forEach(
                function(star) {

                    star.textContent = "☆";

                    star.style.color =
                        "#ff6600";

                }
            );


            const submitButton =
                reviewForm.querySelector(
                    "button"
                );

            if (submitButton) {

                submitButton.textContent =
                    "Submit Review";

            }


        } catch (error) {

            console.error(
                "Review Submit Error:",
                error
            );

            alert(
                error.code +
                "\n" +
                error.message
            );

            alert(
                "Unable to submit review. Please try again."
            );

        }

    };

/* =========================
   PRODUCT REVIEW
========================= */

let selectedProductId = "";
let activeReviewForm = null;

let selectedReviewRating = 0;

window.selectReviewRating =
    function(rating, clickedStar) {

        const reviewForm =
    clickedStar.closest(
        ".review-form"
    );

if (reviewForm) {
    reviewForm.dataset.rating = rating;
}

        const ratingStars =
            clickedStar.closest(
                ".rating-stars"
            );

        if (!ratingStars) {
            return;
        }

        const stars =
            ratingStars.querySelectorAll(
                "span"
            );

        stars.forEach(
            function(star, index) {

                if (index < rating) {

                    star.textContent = "★";
                    star.style.color = "#ff6600";

                } else {

                    star.textContent = "☆";
                    star.style.color = "#ff6600";

                }

            }
        );

    };
window.openProductReview =
    async function(productId, button) {

        selectedProductId =
            productId || "";

        if (
            activeReviewForm &&
            activeReviewForm !== button.nextElementSibling
        ) {
            activeReviewForm.style.display = "none";
        }

        const form =
            button.nextElementSibling;

        if (!form) {
            return;
        }

        if (form.style.display === "block") {

            form.style.display = "none";
            activeReviewForm = null;

            return;
        }


        /* =========================
           CHECK EXISTING REVIEW
        ========================= */

        const user =
            auth.currentUser;

        if (!user) {

            alert("Please login first.");

            return;
        }


        try {

            const reviewQuery =
                query(
                    collection(
                        db,
                        "reviews"
                    ),

                    where(
                        "productId",
                        "==",
                        String(productId)
                    ),

                    where(
                        "orderId",
                        "==",
                        orderId
                    ),

                    where(
                        "userId",
                        "==",
                        user.uid
                    )
                );


            const reviewSnapshot =
                await getDocs(
                    reviewQuery
                );


            /* =========================
               EXISTING REVIEW FOUND
            ========================= */

            if (!reviewSnapshot.empty) {

                const reviewData =
                    reviewSnapshot
                        .docs[0]
                        .data();


                form.dataset.reviewId =
                    reviewSnapshot
                        .docs[0]
                        .id;


                form.dataset.rating =
                    reviewData.rating || 0;


                const textarea =
                    form.querySelector(
                        "textarea"
                    );


                if (textarea) {

                    textarea.value =
                        reviewData.reviewText ||
                        "";

                }


                const stars =
                    form.querySelectorAll(
                        ".rating-stars span"
                    );


                stars.forEach(
                    function(star, index) {

                        if (
                            index <
                            Number(
                                reviewData.rating || 0
                            )
                        ) {

                            star.textContent =
                                "★";

                        } else {

                            star.textContent =
                                "☆";

                        }

                        star.style.color =
                            "#ff6600";

                    }
                );


                const submitButton =
                    form.querySelector(
                        "button"
                    );


                if (submitButton) {

                    submitButton.textContent =
                        "Update Review";

                }

            }


            /* =========================
               NEW REVIEW
            ========================= */

            else {

                delete form.dataset.reviewId;

                form.dataset.rating = "";

                const textarea =
                    form.querySelector(
                        "textarea"
                    );

                if (textarea) {

                    textarea.value = "";

                }


                const stars =
                    form.querySelectorAll(
                        ".rating-stars span"
                    );


                stars.forEach(
                    function(star) {

                        star.textContent =
                            "☆";

                        star.style.color =
                            "#ff6600";

                    }
                );


                const submitButton =
                    form.querySelector(
                        "button"
                    );


                if (submitButton) {

                    submitButton.textContent =
                        "Submit Review";

                }

            }


            form.style.display =
                "block";

            activeReviewForm =
                form;


        } catch (error) {

            console.error(
                "Review Check Error:",
                error
            );

            alert(
                "Unable to load your review. Please try again."
            );

        }

    };

document.addEventListener(
    "click",
    function(event) {

        if (!activeReviewForm) {
            return;
        }

        if (
            event.target.closest(".product") ===
            activeReviewForm.closest(".product")
        ) {
            return;
        }

        activeReviewForm.style.display = "none";
        activeReviewForm = null;

    }
);


</script>
